<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>

  <main class="page">
    <section class="auth-card" aria-label="Authentication panel">
      <div class="auth-switch" role="tablist" aria-label="Authentication mode switch">
        <button type="button" class="switch-button active" data-mode="login">Login</button>
        <span class="divider" aria-hidden="true"></span>
        <button type="button" class="switch-button" data-mode="signup">Sign Up</button>
      </div>

      <div id="messageBox" class="message-box" role="status" aria-live="polite"></div>

      <form id="loginForm" class="auth-form active-form">
        <div class="field-group">
          <label for="loginUsername">Username</label>
          <input type="text" id="loginUsername" name="loginUsername" placeholder="Enter your username" required>
        </div>

        <div class="field-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" name="loginPassword" placeholder="Enter your password" required>
        </div>

        <button class="auth-button" type="submit">Login</button>
      </form>

      <form id="signupForm" class="auth-form">
        <div class="field-group">
          <label for="signupUsername">Username</label>
          <input type="text" id="signupUsername" name="signupUsername" placeholder="Choose a username" required>
        </div>

        <div class="field-group">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword" name="signupPassword" placeholder="Create a strong password" required>
        </div>

        <div class="field-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
        </div>

        <p class="helper-text">Use at least 8 characters, one uppercase letter, one number, and one special character.</p>

        <button class="auth-button" type="submit">Create Account</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
